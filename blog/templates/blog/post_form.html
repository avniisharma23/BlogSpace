{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} | BlogSpace</title>
    <link rel="stylesheet" href="{% static 'blog/style.css' %}">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7fb;
            color: #22223b;
        }

        header {
            background: #312e81;
            color: white;
            padding: 20px 8%;
        }

        header a {
            color: white;
            text-decoration: none;
        }

        main {
            max-width: 700px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0 20px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        button {
            background: #312e81;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        label {
            font-weight: bold;
        }
    </style>
</head>

<body>
    <header>
        <h1>BlogSpace.</h1>
        <a href="/">← Back to Home</a>
    </header>

    <main>
        <h2>{{ page_title }}</h2>
        <p>Share your thoughts, recommendations, and stories.</p>

        <form method="POST">
            {% csrf_token %}

            {{ form.non_field_errors }}

            {% for field in form %}
                <label for="{{ field.id_for_label }}">
                    {{ field.label }}
                </label>

                {{ field }}

                {% for error in field.errors %}
                    <p>{{ error }}</p>
                {% endfor %}
            {% endfor %}

            <button type="submit">Publish Post</button>
        </form>
    </main>
</body>
</html>
