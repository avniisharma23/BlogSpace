{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ post.title }} | BlogSpace</title>
    <link rel="stylesheet" href="{% static 'blog/style.css' %}">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7fb;
            color: #22223b;
        }
        header {
            background: #312e81;
            color: white;
            padding: 22px 8%;
        }
        header a {
            color: white;
            text-decoration: none;
        }
        main {
            max-width: 800px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 14px #0000000d;
        }
        .meta {
            color: #6b7280;
            font-size: 14px;
        }
        .content {
            line-height: 1.8;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <header>
        <h1>BlogSpace.</h1>
        <a href="/">← Back to Home</a>
    </header>

    <main>
        <h2>{{ post.title }}</h2>
        <p class="meta">
            By {{ post.author }} |
            {{ post.created_at|date:"d M Y" }}
        </p>
        <hr>
        <div class="content">{{ post.content }}</div>
        <p>
            <a href="{% url 'edit_post' post.id %}"
               style="color: #312e81;">
                Edit this post
            </a>
            <a href="{% url 'delete_post' post.id %}"
   style="color: #dc2626; margin-left: 15px;">
    Delete this post
</a>
        </p>
    </main>
</body>
</html>
